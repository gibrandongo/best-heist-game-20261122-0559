<style>
  html, body { margin: 0; padding: 0; background: #0a0e1a; height: 100%; overflow: hidden; }

    position: absolute; left: 0; right: 0; bottom: -26px; text-align: center;

  }
</style>

<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="hint">WASD / arrows — move &nbsp;·&nbsp; SHIFT — sneak &nbsp;·&nbsp; CLICK — throw a distraction coin &nbsp;·&nbsp; E — pick a lock &nbsp;·&nbsp; Q — EMP pulse &nbsp;·&nbsp; R — restart room</div>
</div>
